name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute finite scientific evidence and retain strict comparisons
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p057-raw"
          ulimit -v 1048576
          ulimit -t 480
          timeout --signal=TERM --kill-after=20s 18m \
            python -B scripts/reproduce.py \
              --output "$RUNNER_TEMP/p057-raw/reproduction" \
            2>&1 | tee "$RUNNER_TEMP/p057-raw/scientific-checks.log"
      - name: Upload raw output even when scientific checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p057-scientific-output
          path: ${{ runner.temp }}/p057-raw/
          if-no-files-found: warn
          retention-days: 14
